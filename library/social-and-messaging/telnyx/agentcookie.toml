# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "telnyx-pp-cli"
display_name = "Telnyx"
description = "Telnyx messaging, numbers, and voice endpoints, plus a synced message-history mirror, number setup audits, and spend rollups."
project_kind = "cli"

[secrets.file]
path = "~/.config/telnyx-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
TELNYX_API_KEY = true
TELNYX_BEARER_AUTH = true
