version: 2
project_name: bookmakersreview-pp-cli
changelog:
  disable: true
builds:
  - id: bookmakersreview-pp-cli
    main: ./cmd/bookmakersreview-pp-cli
    binary: bookmakersreview-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/bookmakersreview/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: bookmakersreview-pp-mcp
    main: ./cmd/bookmakersreview-pp-mcp
    binary: bookmakersreview-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: bookmakersreview-pp-cli
    repository:
      owner: jimtje
      name: homebrew-tap
    homepage: "https://github.com/jimtje/bookmakersreview-pp-cli"
    description: "Every sportsbook's price, BMR's own sharp consensus, and full line history — for free, from the terminal, no API key required."
    install: |
      bin.install "bookmakersreview-pp-cli"
      bin.install "bookmakersreview-pp-mcp"
