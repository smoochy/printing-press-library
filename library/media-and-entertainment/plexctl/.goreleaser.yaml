version: 2
project_name: plexctl-pp-cli
changelog:
  disable: true
builds:
  - id: plexctl-pp-cli
    main: ./cmd/plexctl-pp-cli
    binary: plexctl-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X plexctl-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: plexctl-pp-mcp
    main: ./cmd/plexctl-pp-mcp
    binary: plexctl-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: plexctl-pp-cli
    repository:
      owner: keithah
      name: homebrew-tap
    homepage: "https://github.com/keithah/plexctl-pp-cli"
    description: "## Content Types The API supports responses in both XML and JSON"
    install: |
      bin.install "plexctl-pp-cli"
      bin.install "plexctl-pp-mcp"
