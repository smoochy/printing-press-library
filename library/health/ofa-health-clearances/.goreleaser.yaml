version: 2
project_name: ofa-health-clearances-pp-cli
changelog:
  disable: true
builds:
  - id: ofa-health-clearances-pp-cli
    main: ./cmd/ofa-health-clearances-pp-cli
    binary: ofa-health-clearances-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/health/ofa-health-clearances/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ofa-health-clearances-pp-mcp
    main: ./cmd/ofa-health-clearances-pp-mcp
    binary: ofa-health-clearances-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ofa-health-clearances-pp-cli
    repository:
      owner: h179922
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Look up dogs' OFA health clearances (hips, elbows, eyes, cardiac, DNA) and CHIC status by breed, age, and report year, and roll them up by kennel."
    install: |
      bin.install "ofa-health-clearances-pp-cli"
      bin.install "ofa-health-clearances-pp-mcp"
