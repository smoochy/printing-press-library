version: 2
project_name: costco-sameday-pp-cli
changelog:
  disable: true
builds:
  - id: costco-sameday-pp-cli
    main: ./cmd/costco-sameday-pp-cli
    binary: costco-sameday-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/costco-sameday/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: costco-sameday-pp-mcp
    main: ./cmd/costco-sameday-pp-mcp
    binary: costco-sameday-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: costco-sameday-pp-cli
    repository:
      owner: dashlabsdev
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Costco Same-Day (sameday.costco.com) GraphQL CLI. Cookie auth after Costco Azure B2C SSO."
    install: |
      bin.install "costco-sameday-pp-cli"
      bin.install "costco-sameday-pp-mcp"
