name: costco-sameday
description: Costco Same-Day (sameday.costco.com) GraphQL CLI. Cookie auth after Costco
  Azure B2C SSO. Place-order mutation is FinalizeCheckout — exposed only via gated
  `order place` (--yes + --confirm-charge; --dry-run never charges). Tip updates via
  UpdateCheckout tipsUpdate. Cancel mutation not captured.
version: 0.1.0
base_url: https://sameday.costco.com
spec_source: sniffed
auth:
  type: cookie
  cookie_domain: sameday.costco.com
  cookies:
  - __Host-instacart_sid
  - _instacart_session_id
  - X-IC-bcx
  - ahoy_visitor
  - ahoy_visit
  - build_sha
  login_url: https://sameday.costco.com/rest/sso/auth/costco/init
  verify_path: /graphql?operationName=GlobalMainMenuLayout&variables=%7B%22zoneId%22%3A%222801%22%7D&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%221ad8b3952d5868ab9903e6e41d0a7b233a004906d2b61de49fee2d394f5f3fea%22%7D%7D
auth_warnings:
- 'SSO flow: sameday /rest/sso/auth/costco/init → www.costco.com/logon-instacart →
  signin.costco.com Azure B2C (B2C_1A_SSO_WCS_signup_signin_214) → www.costco.com/OAuthLogonCmd
  → sameday /rest/sso/auth/costco/callback (sets __Host-instacart_sid) → /store.'
- This SSO capture completed Costco sign-in WITHOUT an OTP prompt; OTP path still
  uncaptured.
- Azure B2C cookies (x-ms-cpim-*) are for signin.costco.com only; API session uses
  Instacart cookies on sameday.costco.com.
- Never commit HAR or cookie values. Import via auth login --chrome / cookie jar.
- 'Place-order HAR (2026-10-06): FinalizeCheckout is the charge mutation; UpdateCheckout.tipsUpdate
  changes tip; CustomerCancelSelections is read-only (no cancel mutation in HAR).'
