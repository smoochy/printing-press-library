version: 2
project_name: homedepot-pp-cli
changelog:
  disable: true
builds:
  - id: homedepot-pp-cli
    main: ./cmd/homedepot-pp-cli
    binary: homedepot-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/homedepot/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: homedepot-pp-mcp
    main: ./cmd/homedepot-pp-mcp
    binary: homedepot-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: homedepot-pp-cli
    repository:
      owner: greg-mushen
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search products, manage your cart, and retrieve purchases using your own signed-in session."
    install: |
      bin.install "homedepot-pp-cli"
      bin.install "homedepot-pp-mcp"
