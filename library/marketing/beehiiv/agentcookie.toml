# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "beehiiv-pp-cli"
display_name = "Beehiiv"
description = "Sync your Beehiiv audience to a local database and answer growth questions offline in one command."
project_kind = "cli"

[secrets.file]
path = "~/.config/beehiiv-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
BEEHIIV_API_KEY = true
